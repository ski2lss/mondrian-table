<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мондриан</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <table class="mondrian">
      <colgroup>
        <col class="col-1">
        <col class="col-2">
        <col class="col-3">
        <col class="col-4">
        <col class="col-5">
        <col class="col-6">
      </colgroup>

      <tbody>
        <tr class="row-1">
          <td class="white"></td>
          <td class="white" colspan="2"></td>
          <td class="yellow" colspan="2"></td>
          <td class="white"></td>
        </tr>

        <tr class="row-2">
          <td class="white" rowspan="2"></td>
          <td class="red" colspan="2"></td>
          <td class="yellow" colspan="2"></td>
          <td class="white"></td>
        </tr>

        <tr class="row-3">
          <td class="black"></td>
          <td class="white"></td>
          <td class="white" colspan="2"></td>
          <td class="white"></td>
        </tr>

        <tr class="row-4">
          <td class="yellow"></td>
          <td class="white" colspan="1"></td>
          <td class="blue" colspan="3"></td>
          <td class="red"></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
